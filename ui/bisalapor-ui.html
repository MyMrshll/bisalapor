<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0F1E55" />
  <title>BisaLapor — Product UI v2</title>
  <style>
    :root {
      --bg: #ffffff;
      --navy: rgba(255, 255, 255, .78);
      --surface: rgba(255, 255, 255, .64);
      --surface-2: rgba(247, 250, 255, .72);
      --inset: rgba(241, 245, 251, .82);
      --ink: #10204f;
      --muted: #64708b;
      --line: rgba(15, 30, 85, .12);
      --highlight: rgba(255, 255, 255, .9);
      --shadow: rgba(15, 30, 85, .16);
      --brand: #0f1e55;
      --blue: #2f6fda;
      --success: #238653;
      --warning: #a96b00;
      --error: #c73548;
      --glass-blur: 18px;
      --glass-border: rgba(255, 255, 255, .78);
      --glass-shadow: 0 14px 34px rgba(15, 30, 85, .09), 0 3px 10px rgba(15, 30, 85, .05), inset 0 1px 0 rgba(255, 255, 255, .92);
      --radius-lg: 18px;
      --radius-md: 13px;
      --radius-sm: 10px;
      --ease: cubic-bezier(.2,.8,.2,1);

      /* Systematic Spacing Scale */
      --gap-xs: 4px;
      --gap-sm: 8px;
      --gap-md: 12px;
      --gap-lg: 16px;
      --gap-xl: 20px;
      --gap-2xl: 24px;
      --gap-3xl: 28px;
      --gap-4xl: 32px;
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: var(--bg);
      background-image: radial-gradient(circle at 8% 0%, rgba(116, 165, 255, .13), transparent 34%), radial-gradient(circle at 92% 8%, rgba(15, 30, 85, .08), transparent 30%);
      background-attachment: fixed;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 21px; font-weight: 750; letter-spacing: -.025em; line-height: 1.25; color: #0f172a; }
    h2 { font-size: 15px; font-weight: 700; letter-spacing: -.015em; color: #0f172a; }
    .subtitle { margin-top: 4px; color: #64748b; font-size: 13px; font-weight: 400; line-height: 1.4; }

    .app { min-height: 100vh; display: flex; }

    /* Sidebar Navigation (Icon Rail - 3x Icon Size) */
    .sidebar {
      width: 136px;
      flex: 0 0 136px;
      min-height: 100vh;
      height: 100vh;
      position: sticky;
      top: 0;
      padding: 24px 12px 20px;
      background: #ffffff;
      border-right: 1px solid rgba(226, 232, 240, 0.85);
      box-shadow: 2px 0 16px rgba(15, 30, 85, .03);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .sidebar::-webkit-scrollbar { display: none; }
    .brand { display: flex; justify-content: center; align-items: center; padding: 0 0 12px; width: 100%; }
    /* Brand mark enlarged 2x from the original 54px artwork. */
    .brand-logo-btn { width: 124px; height: 124px; border-radius: 28px; display: grid; place-items: center; background: transparent; border: none; padding: 0; cursor: pointer; transition: transform .18s var(--ease); }
    .brand-logo-btn:hover { transform: scale(1.04); }
    .logo-mark { width: 108px; height: 108px; border-radius: 22px; object-fit: contain; }
    .brand-fallback { display: grid; place-items: center; width: 108px; height: 108px; border-radius: 24px; background: linear-gradient(135deg, #1b3585, #0f1e55); color: #ffffff; font-weight: 800; font-size: 44px; box-shadow: 0 10px 24px rgba(15, 30, 85, 0.24); }
    .nav { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
    .nav button {
      position: relative;
      width: 74px;
      height: 74px;
      display: grid;
      place-items: center;
      padding: 0;
      color: #64748b;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 22px;
      transition: all .2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .nav button:hover {
      color: var(--brand);
      background: rgba(15, 30, 85, 0.07);
      transform: translateY(-2px);
    }
    .nav button.active {
      color: #ffffff;
      background: linear-gradient(135deg, #182d73 0%, #0f1e55 100%);
      box-shadow: 0 12px 28px -2px rgba(15, 30, 85, 0.45), 0 4px 12px rgba(15, 30, 85, 0.22);
      border-color: transparent;
    }
    .nav button.active:hover {
      background: linear-gradient(135deg, #1e378c 0%, #132463 100%);
      color: #ffffff;
      transform: translateY(-2px);
    }
    /* 3x Larger Icon Size (60px) */
    .nav-icon { width: 58px; height: 58px; color: currentColor; display: grid; place-items: center; flex-shrink: 0; }
    .nav-icon svg { width: 58px; height: 58px; stroke-width: 1.85; }
    .nav button.active .nav-icon svg { stroke-width: 2.1; }

    /* Right-side Tooltips */
    .nav button[data-tooltip]::after,
    .sidebar-lock-btn[data-tooltip]::after,
    .sidebar-action-btn[data-tooltip]::after,
    .sidebar-avatar-btn[data-tooltip]::after {
      content: attr(data-tooltip);
      position: absolute;
      left: calc(100% + 14px);
      top: 50%;
      transform: translateY(-50%) scale(0.92);
      transform-origin: left center;
      background: #0f1e55;
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.01em;
      white-space: nowrap;
      padding: 7px 12px;
      border-radius: 9px;
      box-shadow: 0 8px 22px rgba(15, 30, 85, 0.28);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s cubic-bezier(0.4, 0, 0.2, 1), transform 0.18s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 50;
    }
    .nav button[data-tooltip]::before,
    .sidebar-lock-btn[data-tooltip]::before,
    .sidebar-action-btn[data-tooltip]::before,
    .sidebar-avatar-btn[data-tooltip]::before {
      content: '';
      position: absolute;
      left: calc(100% + 7px);
      top: 50%;
      transform: translateY(-50%);
      border-width: 6px 7px 6px 0;
      border-style: solid;
      border-color: transparent #0f1e55 transparent transparent;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 50;
    }
    .nav button[data-tooltip]:hover::after,
    .nav button[data-tooltip]:hover::before,
    .sidebar-lock-btn[data-tooltip]:hover::after,
    .sidebar-lock-btn[data-tooltip]:hover::before,
    .sidebar-action-btn[data-tooltip]:hover::after,
    .sidebar-action-btn[data-tooltip]:hover::before,
    .sidebar-avatar-btn[data-tooltip]:hover::after,
    .sidebar-avatar-btn[data-tooltip]:hover::before {
      opacity: 1;
      transform: translateY(-50%) scale(1);
    }

    .sidebar-spacer { flex: 1; min-height: 12px; }
    .sidebar-bottom { display: flex; flex-direction: column; align-items: center; width: 100%; padding-bottom: 12px; }
    .sidebar-crumbs { display: none; }
    .sidebar-actions-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      margin-bottom: 6px;
    }
    .sidebar-action-btn {
      position: relative;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      background: #f8fafc;
      color: #64748b;
      border: 1px solid rgba(226, 232, 240, 0.95);
      border-radius: 12px;
      cursor: pointer;
      transition: all .18s var(--ease);
      padding: 0;
    }
    .sidebar-action-btn:hover {
      color: var(--brand);
      background: #ffffff;
      border-color: rgba(15, 30, 85, 0.25);
      box-shadow: 0 4px 12px rgba(15, 30, 85, 0.08);
      transform: translateY(-2px);
    }
    .sidebar-action-btn svg, .sidebar-action-btn [data-icon] svg {
      width: 19px;
      height: 19px;
      stroke-width: 2;
    }
    .sidebar-action-btn .badge-dot {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ef4444;
      border: 1.5px solid #ffffff;
    }
    .sidebar-avatar-btn {
      position: relative;
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      background: transparent;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      padding: 0;
      margin-bottom: 6px;
      transition: transform .18s var(--ease);
    }
    .sidebar-avatar-btn:hover {
      transform: translateY(-2px);
    }
    .sidebar-avatar-btn .avatar {
      width: 40px;
      height: 40px;
      font-size: 12px;
      font-weight: 800;
      background: linear-gradient(135deg, #182d73 0%, #0f1e55 100%);
      color: #ffffff;
      border: 2px solid #ffffff;
      box-shadow: 0 4px 12px rgba(15, 30, 85, 0.22);
    }
    .sidebar-avatar-btn .status-dot {
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #10b981;
      border: 2px solid #ffffff;
      box-shadow: 0 0 0 1px rgba(16, 185, 129, 0.3);
    }
    .sidebar-divider { width: 44px; height: 1.5px; background: rgba(15, 30, 85, 0.12); margin: 4px 0 8px; }
    .sidebar-lock-btn {
      position: relative;
      width: 72px;
      height: 56px;
      border-radius: 18px;
      border: 2px dashed rgba(15, 30, 85, 0.28);
      background: transparent;
      color: #64748b;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .sidebar-lock-btn:hover {
      border-color: var(--brand);
      color: var(--brand);
      background: rgba(15, 30, 85, 0.06);
      transform: translateY(-2px);
    }
    .sidebar-lock-btn .nav-icon { width: 42px; height: 42px; }
    .sidebar-lock-btn .nav-icon svg { width: 42px; height: 42px; stroke-width: 1.85; }
    .avatar { width: 34px; height: 34px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 50%; background: var(--brand); border: 1px solid var(--highlight); color: var(--blue); font-size: 10px; font-weight: 800; }

    /* Main Content Area */
    .main { min-width: 0; flex: 1; width: 100%; background: #f8fafc; }
    .topbar { display: none; }
    .content { width: 100%; max-width: none; padding: 28px 36px 48px; box-sizing: border-box; }

    /* Page Heading & Actions */
    .page-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
    .actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .btn { height: 38px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 0 16px; color: var(--blue); background: #ffffff; border: 1px solid rgba(226, 232, 240, 0.9); border-radius: 11px; font-weight: 600; font-size: 12.5px; box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03); transition: transform .18s var(--ease), box-shadow .18s var(--ease), background .18s var(--ease); white-space: nowrap; }
    .btn:hover { transform: translateY(-1px); background: #f8fafc; }
    .btn.primary { color: #ffffff; background: var(--brand); border-color: transparent; box-shadow: 0 6px 16px -2px rgba(15, 30, 85, 0.35); }
    .btn.primary:hover { background: #172d73; }
    .btn.danger { color: var(--error); }
    .btn.small { height: 32px; padding: 0 11px; font-size: 11.5px; border-radius: 9px; }

    .icon, [data-icon] { width: 15px; height: 15px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .icon svg, [data-icon] svg { width: 100%; height: 100%; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; display: block; }

    /* Filter Toolbar */
    .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .toolbar > .search { flex: 1 1 260px; min-width: 200px; }
    .toolbar > .select-like, .toolbar > .btn { height: 38px; }
    .search { height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: #ffffff; border: 1px solid rgba(226, 232, 240, 0.9); border-radius: 11px; box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03); }
    .search input { width: 100%; color: #0f172a; background: none; border: 0; outline: 0; font-size: 12.5px; }
    .search input::placeholder { color: var(--muted); }
    .select-like { height: 38px; display: inline-flex; align-items: center; gap: 8px; padding: 0 14px; color: #475569; background: #ffffff; border: 1px solid rgba(226, 232, 240, 0.9); border-radius: 11px; font-size: 12px; font-weight: 500; box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03); cursor: pointer; white-space: nowrap; }

    /* Surface & Panels */
    .surface { background: #ffffff; border: 1px solid rgba(226, 232, 240, 0.85); border-radius: 18px; box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.04); isolation: isolate; }
    .panel { padding: 22px 24px; }
    .panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
    .panel-subtitle { margin-top: 3px; color: #8593a8; font-size: 12px; font-weight: 400; }
    .panel-link { display: inline-flex; align-items: center; gap: 6px; margin-top: 16px; color: var(--blue); border: 0; background: transparent; font-size: 12px; font-weight: 600; padding: 0; cursor: pointer; }

    .dashboard-grid, .bottom-grid, .detail-grid, .review-layout, .inbox-layout, .settings-layout { display: grid; gap: 20px; }
    .dashboard-grid { grid-template-columns: 1.6fr 1fr; }
    .bottom-grid { grid-template-columns: 1.6fr 1fr; margin-top: 20px; }
    .detail-grid { grid-template-columns: 1.05fr .7fr; }
    .review-layout { grid-template-columns: .75fr 1.15fr; }
    .inbox-layout { grid-template-columns: .85fr 1fr; }
    .settings-layout { grid-template-columns: 240px 1fr; }
    .review-layout > .panel, .inbox-layout > .panel { min-width: 0; }

    /* Metrics Grid */
    .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; margin-bottom: 22px; }
    .metric { min-height: 116px; padding: 18px 20px; border-radius: 18px; background: #ffffff; border: 1px solid rgba(226, 232, 240, 0.85); box-shadow: 0 4px 16px rgba(15, 30, 85, 0.03); display: flex; flex-direction: column; justify-content: space-between; transition: transform .18s var(--ease), box-shadow .18s var(--ease); }
    .metric:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(15, 30, 85, 0.06); }
    .metric:first-child { background: linear-gradient(135deg, #182d73 0%, #0f1e55 100%); color: #ffffff; border-color: transparent; box-shadow: 0 10px 24px -2px rgba(15, 30, 85, 0.35); }
    .metric:first-child .metric-head-label { color: rgba(255, 255, 255, 0.85); }
    .metric:first-child .metric-value { color: #ffffff; }
    .metric:first-child .metric-detail { color: rgba(255, 255, 255, 0.75); }
    .metric:first-child .metric-pill { background: rgba(255, 255, 255, 0.2); color: #ffffff; }
    .metric-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
    .metric-head-label { font-size: 13px; font-weight: 500; color: #64748b; }
    .metric-pill { font-size: 11px; font-weight: 600; padding: 2.5px 8.5px; border-radius: 9999px; background: rgba(35, 134, 83, 0.1); color: var(--success); }
    .metric-value { font-size: 24px; font-weight: 750; letter-spacing: -.03em; margin: 4px 0 6px; line-height: 1.15; color: #0f172a; }
    .metric-detail { font-size: 11.5px; color: #8593a8; display: flex; align-items: center; gap: 5px; }

    /* Indicators & Badges */
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .blue { background: var(--blue); } .green { background: var(--success); } .yellow { background: var(--warning); } .red { background: var(--error); } .gray { background: var(--muted); }

    .badge { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: rgba(255,255,255,.7); border: 1px solid rgba(15,30,85,.13); box-shadow: 0 5px 14px rgba(15,30,85,.07), inset 0 1px 0 rgba(255,255,255,.9); color: var(--blue); font-size: 10px; font-weight: 700; white-space: nowrap; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); flex-shrink: 0; }
    .badge.success { color: var(--success); }
    .badge.warning { color: var(--warning); }
    .badge.error { color: var(--error); }
    .badge.neutral { color: var(--muted); }

    /* Overview Chart, Review, Activity & AI Status */
    .chart { min-height: 290px; }
    .chart-head-right { text-align: right; }
    .chart-total { font-size: 24px; font-weight: 800; line-height: 1; }
    .chart-total-label { color: var(--muted); font-size: 10px; text-transform: uppercase; margin-top: 2px; }
    .bars { height: 180px; display: flex; align-items: end; justify-content: space-around; gap: 20px; padding: 16px 16px 0; border-bottom: 1px solid var(--line); }
    .bar-wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: end; gap: 10px; flex: 1; }
    .bar { width: 44px; max-width: 80%; min-height: 18px; border-radius: 8px 8px 3px 3px; box-shadow: -3px -3px 7px rgba(116,165,255,.15), 4px 4px 7px rgba(8,15,50,.46); }
    .bar-label { color: var(--muted); font-size: 9px; font-weight: 700; text-align: center; }
    .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-top: 18px; color: var(--muted); font-size: 11px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }

    .review-list { display: flex; flex-direction: column; gap: 0; }
    .review-row { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .review-row:last-child { border-bottom: 0; }
    .review-title { font-size: 12px; font-weight: 700; line-height: 1.3; }
    .review-meta { margin-top: 3px; color: var(--muted); font-size: 11px; }

    .activity-list { display: flex; flex-direction: column; gap: 14px; }
    .activity-row { display: grid; grid-template-columns: 10px minmax(0, 1fr); align-items: flex-start; gap: 12px; }
    .activity-row .dot { margin-top: 6px; }
    .activity-title { font-size: 12px; font-weight: 600; line-height: 1.3; }
    .activity-time { color: var(--muted); font-size: 11px; margin-top: 3px; }

    .ai-status { display: flex; align-items: center; gap: 8px; color: var(--success); font-size: 13px; font-weight: 700; margin-bottom: 20px; }
    .split-stats { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
    .split-stats .value { font-size: 18px; font-weight: 800; }
    .split-stats .small { color: var(--muted); font-size: 11px; }
    .progress { height: 8px; margin: 12px 0 20px; overflow: hidden; border-radius: 10px; background: var(--inset); }
    .progress > span { display: block; width: 96.4%; height: 100%; background: var(--success); border-radius: inherit; box-shadow: 0 0 10px rgba(113,211,155,.24); }

    /* Data Tables */
    .table-wrap { padding: 0; overflow-x: auto; border-radius: var(--radius-lg); }
    .data-table { width: 100%; border-collapse: collapse; min-width: 860px; }
    .data-table th { padding: 18px 20px 14px; color: var(--muted); font-size: 10px; text-align: left; letter-spacing: .08em; font-weight: 800; border-bottom: 1px solid var(--line); }
    .data-table td { padding: 16px 20px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    .data-table tbody tr:last-child td { border-bottom: 0; }
    .data-table tbody tr:hover { background: rgba(116,165,255,.08); }
    .cell-title { font-size: 12px; font-weight: 700; line-height: 1.3; }
    .cell-meta { color: var(--muted); font-size: 11px; margin-top: 3px; }
    .cell-muted { color: var(--muted); font-size: 12px; }
    .cell-blue { color: var(--blue); font-size: 11px; font-weight: 600; }
    .row-actions { width: 36px; height: 36px; display: inline-grid; place-items: center; border: 0; color: var(--muted); background: transparent; border-radius: 8px; padding: 0; transition: .15s var(--ease); }
    .row-actions:hover { color: var(--ink); background: rgba(255,255,255,.7); }

    /* Tabs & Details */
    .tabs { display: flex; gap: 24px; overflow-x: auto; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
    .tab { position: relative; padding: 0 0 12px; color: var(--muted); border: 0; background: none; white-space: nowrap; font-size: 13px; font-weight: 600; transition: color .15s var(--ease); }
    .tab:hover { color: var(--ink); }
    .tab.active { color: var(--blue); font-weight: 700; }
    .tab.active::after { content: ""; position: absolute; height: 3px; left: 0; right: 0; bottom: -1px; border-radius: 3px; background: var(--blue); }

    .detail-summary { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px 20px; margin-bottom: 24px; }
    .field-value { margin-top: 6px; font-size: 13px; font-weight: 650; }
    .field-desc { grid-column: 1 / -1; color: var(--muted); font-size: 12px; margin-top: 6px; padding-top: 14px; border-top: 1px solid var(--line); line-height: 1.5; }

    .timeline-list { display: flex; flex-direction: column; gap: 0; margin-bottom: 20px; }
    .timeline-row { position: relative; display: grid; grid-template-columns: 20px 1fr; gap: 14px; min-height: 68px; padding-bottom: 16px; }
    .timeline-row::before { content: ""; position: absolute; width: 2px; top: 16px; bottom: 0; left: 9px; background: var(--line); }
    .timeline-row:last-child { min-height: auto; padding-bottom: 0; }
    .timeline-row:last-child::before { display: none; }
    .timeline-dot { position: relative; z-index: 1; width: 12px; height: 12px; margin-top: 3px; border-radius: 50%; background: var(--blue); border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--highlight); justify-self: center; }
    .timeline-dot.green { background: var(--success); }
    .timeline-dot.yellow { background: var(--warning); }
    .timeline-title { font-size: 13px; font-weight: 700; line-height: 1.3; }
    .timeline-meta { margin-top: 3px; color: var(--muted); font-size: 11px; }

    .note { padding: 16px 18px; background: rgba(241,245,251,.66); border: 1px solid rgba(15,30,85,.11); border-radius: 12px; box-shadow: inset 2px 2px 7px rgba(15,30,85,.045), inset -2px -2px 7px rgba(255,255,255,.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    .note p { margin-top: 6px; color: var(--ink); font-size: 12px; line-height: 1.5; }

    .person { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
    .person-name { font-size: 13px; font-weight: 700; line-height: 1.2; }
    .person-role { color: var(--muted); margin-top: 2px; font-size: 11px; }

    .steps { display: flex; flex-direction: column; gap: 0; margin-bottom: 22px; }
    .step { position: relative; display: flex; align-items: center; gap: 12px; min-height: 44px; }
    .step::before { content: ""; position: absolute; left: 6px; top: 22px; bottom: -22px; width: 2px; background: var(--line); }
    .step:last-child::before { display: none; }
    .step-dot { position: relative; z-index: 1; width: 14px; height: 14px; border: 2px solid var(--line); border-radius: 50%; background: var(--inset); }
    .step.done .step-dot { background: var(--success); border-color: var(--success); }
    .step-label { font-size: 12px; color: var(--muted); font-weight: 500; }
    .step.done .step-label { color: var(--ink); font-weight: 650; }

    .attachment { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: rgba(241,245,251,.66); border: 1px solid rgba(15,30,85,.11); border-radius: 12px; box-shadow: inset 2px 2px 7px rgba(15,30,85,.045), inset -2px -2px 7px rgba(255,255,255,.88); margin-bottom: 18px; }
    .attachment-main { font-size: 12px; font-weight: 700; line-height: 1.2; }
    .attachment-meta { color: var(--muted); font-size: 11px; margin-top: 3px; }

    /* Report Review Components */
    .source-info { display: flex; flex-direction: column; gap: 3px; margin: 12px 0 16px; }
    .source-sender { color: var(--ink); font-weight: 700; font-size: 12px; }
    .source-meta { color: var(--muted); font-size: 11px; }
    .source-message { padding: 16px 18px; background: rgba(241,245,251,.66); border: 1px solid rgba(15,30,85,.11); border-radius: 12px; color: var(--ink); font-size: 12px; line-height: 1.5; box-shadow: inset 2px 2px 7px rgba(15,30,85,.045), inset -2px -2px 7px rgba(255,255,255,.88); margin-bottom: 20px; }
    .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; margin-bottom: 18px; }
    .photo { min-height: 84px; position: relative; overflow: hidden; display: flex; align-items: end; padding: 9px; border: 1px solid var(--highlight); border-radius: 11px; background: var(--brand); color: var(--muted); font-size: 10px; font-weight: 600; }
    .photo::before { content: ""; position: absolute; width: 70px; height: 34px; left: 23px; top: 23px; border-radius: 6px; background: var(--navy); box-shadow: 0 0 0 5px rgba(116,165,255,.08); }
    .photo::after { content: ""; position: absolute; width: 46px; height: 3px; left: 35px; top: 51px; border-radius: 4px; background: var(--blue); opacity: .55; }
    .audio { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: rgba(241,245,251,.66); border: 1px solid rgba(15,30,85,.11); border-radius: 12px; box-shadow: inset 2px 2px 7px rgba(15,30,85,.045), inset -2px -2px 7px rgba(255,255,255,.88); margin-bottom: 16px; }
    .audio-name { font-size: 11px; font-weight: 650; }
    .audio-duration { color: var(--muted); font-size: 10px; margin-top: 2px; }

    .draft-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
    .draft-title { margin-top: 6px; font-size: 20px; font-weight: 800; letter-spacing: -.03em; }
    .draft-meta { margin-top: 4px; color: var(--muted); font-size: 11px; }
    .draft-section { padding: 18px 0; border-bottom: 1px solid var(--line); }
    .draft-section:last-of-type { border-bottom: 0; }
    .draft-section h3 { color: var(--blue); font-size: 12px; font-weight: 700; }
    .draft-section p { margin-top: 6px; color: var(--ink); font-size: 12px; max-width: 680px; line-height: 1.55; }
    .warning-box { display: flex; align-items: flex-start; gap: 12px; margin-top: 20px; padding: 14px 16px; background: rgba(241,245,251,.66); border: 1px solid var(--warning); border-radius: 12px; box-shadow: inset 2px 2px 7px rgba(15,30,85,.045), inset -2px -2px 7px rgba(255,255,255,.88); }
    .warning-box strong { display: block; color: var(--warning); font-size: 12px; line-height: 1.3; }
    .warning-box p { margin-top: 3px; color: var(--muted); font-size: 11px; line-height: 1.4; }

    /* AI Inbox Components */
    .message-items { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
    .message-item { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 12px; padding: 12px; border: 1px solid transparent; border-radius: 12px; text-align: left; background: none; color: inherit; align-items: flex-start; transition: .15s var(--ease); }
    .message-item:hover, .message-item.selected { background: var(--surface-2); border-color: var(--highlight); }
    .message-preview { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .message-sender { font-size: 12px; font-weight: 700; line-height: 1.2; }
    .message-snippet { overflow: hidden; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .message-preview .badge { align-self: flex-start; margin-top: 3px; }
    .message-time { color: var(--muted); font-size: 10px; white-space: nowrap; margin-top: 2px; }

    .inbox-detail { display: flex; flex-direction: column; gap: 20px; }
    .inbox-section { display: flex; flex-direction: column; gap: 8px; }
    .inbox-sender-name { font-size: 18px; font-weight: 750; letter-spacing: -.02em; line-height: 1.2; }
    .message-bubble { padding: 16px 18px; background: rgba(241,245,251,.66); border: 1px solid rgba(15,30,85,.11); border-radius: 14px; font-size: 12px; line-height: 1.5; box-shadow: inset 2px 2px 7px rgba(15,30,85,.045), inset -2px -2px 7px rgba(255,255,255,.88); margin-top: 4px; }
    .linked { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--surface-2); border: 1px solid var(--highlight); border-radius: 13px; margin-top: 4px; }
    .linked-title { font-size: 12px; font-weight: 700; line-height: 1.2; }
    .linked-meta { color: var(--muted); font-size: 11px; margin-top: 2px; }
    .linked .badge { margin-left: auto; }
    .inbox-desc { font-size: 12px; color: var(--ink); line-height: 1.5; margin: 2px 0 0; }
    .inbox-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
    .inbox-audit-note { margin-top: 6px; }

    /* Customers Components */
    .customer-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    .customer-card { padding: 22px; }
    .customer-header { display: flex; align-items: center; gap: 12px; }
    .customer-avatar { width: 44px; height: 44px; border-radius: 12px; font-size: 13px; }
    .customer-header h2 { font-size: 15px; }
    .customer-header .row-actions { margin-left: auto; }
    .customer-divider { height: 1px; background: var(--line); margin: 18px 0; }
    .customer-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    /* Settings Components */
    .settings-nav { display: flex; flex-direction: column; gap: 4px; padding: 18px 16px; height: fit-content; }
    .settings-link { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; color: var(--muted); border: 1px solid transparent; border-radius: 11px; background: transparent; text-align: left; font-size: 12px; font-weight: 600; transition: .15s var(--ease); }
    .settings-link:hover { color: var(--ink); background: rgba(255,255,255,.5); }
    .settings-link.active { color: var(--ink); background: var(--surface-2); border-color: var(--highlight); font-weight: 700; }
    .settings-divider { height: 1px; background: var(--line); margin: 16px 0; }
    .settings-field { margin: 0 6px 14px; }
    .settings-field:last-child { margin-bottom: 4px; }
    .settings-field .value { margin-top: 5px; font-size: 12px; font-weight: 700; }
    .settings-field .badge { margin-top: 5px; }

    .settings-content { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
    .member-row { display: grid; grid-template-columns: minmax(0, 1fr) 140px 120px 36px; align-items: center; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .member-row:last-child { border-bottom: 0; }
    .member-header { padding: 0 0 14px; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .08em; }
    .member { display: flex; align-items: center; gap: 10px; }
    .member-name { font-size: 12px; font-weight: 700; line-height: 1.2; }
    .member-email { color: var(--muted); font-size: 11px; margin-top: 2px; }

    .integration-row { display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: var(--surface-2); border: 1px solid var(--highlight); border-radius: 13px; }
    .integration-title { font-size: 12px; font-weight: 700; line-height: 1.2; }
    .integration-meta { color: var(--muted); font-size: 11px; margin-top: 2px; }
    .integration-row .badge { margin-left: auto; }
    .integration-actions { margin-top: 18px; }
    .integration-desc { margin-top: 16px; }

    /* Toast Notification */
    .hidden { display: none !important; }
    .toast { position: fixed; z-index: 20; right: 24px; bottom: 24px; max-width: 380px; padding: 12px 18px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--highlight); border-radius: 12px; box-shadow: -5px -5px 12px rgba(52,80,156,.15), 7px 7px 14px rgba(8,15,50,.62); transform: translateY(20px); opacity: 0; pointer-events: none; transition: .25s var(--ease); font-size: 12px; font-weight: 600; }
    .toast.show { transform: translateY(0); opacity: 1; }

    /* Responsive Breakpoints */
    @media (max-width: 1180px) {
      .sidebar { width: 136px; flex-basis: 136px; padding: 20px 8px; }
      .nav button, .sidebar-lock-btn { width: 68px; height: 68px; border-radius: 18px; }
      .brand-logo-btn { width: 84px; height: 84px; border-radius: 20px; }
      .nav-icon, .nav-icon svg, .sidebar-lock-btn .nav-icon, .sidebar-lock-btn .nav-icon svg { width: 50px; height: 50px; }
      .logo-mark, .brand-fallback { width: 72px; height: 72px; border-radius: 18px; }
      .content { padding: 20px 20px 36px; }
      .metrics { grid-template-columns: repeat(2, 1fr); gap: 14px; }
      .dashboard-grid, .bottom-grid, .detail-grid, .review-layout, .inbox-layout { grid-template-columns: 1fr; gap: 20px; }
      .detail-summary { grid-template-columns: repeat(3, 1fr); }
      .customer-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 760px) {
      .app { display: block; }
      .sidebar { width: 100%; min-height: auto; height: auto; position: static; padding: 10px 14px; border-right: 0; border-bottom: 1px solid var(--line); flex-direction: row; justify-content: space-between; align-items: center; }
      .brand { padding: 0; width: auto; }
      .brand-logo-btn { width: 64px; height: 64px; }
      .logo-mark, .brand-fallback { width: 54px; height: 54px; border-radius: 15px; }
      .nav { flex-direction: row; gap: 8px; width: auto; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; }
      .nav::-webkit-scrollbar { display: none; }
      .nav button { width: 52px; height: 52px; border-radius: 15px; }
      .nav-icon, .nav-icon svg { width: 36px; height: 36px; }
      .nav button[data-tooltip]::before, .nav button[data-tooltip]::after,
      .sidebar-lock-btn[data-tooltip]::before, .sidebar-lock-btn[data-tooltip]::after,
      .sidebar-action-btn[data-tooltip]::before, .sidebar-action-btn[data-tooltip]::after,
      .sidebar-avatar-btn[data-tooltip]::before, .sidebar-avatar-btn[data-tooltip]::after { display: none !important; }
      .sidebar-spacer, .sidebar-divider, .sidebar-crumbs { display: none; }
      .sidebar-bottom { width: auto; padding: 0; display: flex; flex-direction: row; align-items: center; gap: 6px; }
      .sidebar-actions-row { width: auto; margin-bottom: 0; gap: 6px; }
      .sidebar-action-btn { width: 36px; height: 36px; border-radius: 10px; }
      .sidebar-action-btn svg, .sidebar-action-btn [data-icon] svg { width: 17px; height: 17px; }
      .sidebar-avatar-btn { width: 36px; height: 36px; margin: 0; }
      .sidebar-avatar-btn .avatar { width: 34px; height: 34px; font-size: 11px; }
      .sidebar-lock-btn { width: 44px; height: 44px; border-radius: 12px; margin: 0; }
      .sidebar-lock-btn .nav-icon, .sidebar-lock-btn .nav-icon svg { width: 28px; height: 28px; }
      .content { padding: 32px 16px 40px; }
      .page-heading { display: flex; flex-direction: row; align-items: center; gap: 16px; margin-bottom: 32px; }
      .page-heading > div:first-child { min-width: 0; flex: 1 1 auto; }
      .page-heading .actions { justify-content: flex-end; gap: 8px; margin-left: auto; }
      .page-heading .actions > * { flex: 0 0 auto; }
      .page-heading h1 { font-size: 26px; }
      .page-heading .subtitle { max-width: 260px; }
      .page-heading .btn { min-height: 44px; }
      .page-heading .badge { display: none; }
      .crumbs { display: none; }
      .toolbar { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 20px; }
      .toolbar > .search { grid-column: 1 / -1; width: 100%; min-width: 0; }
      .toolbar > .select-like, .toolbar > .btn { width: 100%; min-width: 0; justify-content: center; }
      .toolbar > .btn:last-child { grid-column: 1 / -1; }
      .toolbar-meta { display: none; }
      .metrics { grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
      .metric { min-height: 104px; padding: 14px; }
      .metric-value { font-size: 24px; }
      .panel { padding: 18px 16px; }
      .panel-head { margin-bottom: 18px; }
      .bottom-grid { margin-top: 16px; }
      .detail-summary { grid-template-columns: repeat(2, 1fr); gap: 14px; padding: 18px 16px; }
      .settings-layout { grid-template-columns: 1fr; gap: 18px; }
      .settings-nav { display: flex; flex-direction: row; overflow-x: auto; gap: 6px; padding: 12px; }
      .settings-link { width: auto; white-space: nowrap; }
      .settings-divider, .settings-field { display: none; }
      .member-row { grid-template-columns: minmax(0, 1fr) 100px 30px; gap: 10px; }
      .member-row > :nth-child(3) { display: none; }
      .bars { gap: 10px; padding: 12px 0 0; }
      .bar { width: 32px; }
      .table-wrap { padding: 12px; }
      .data-table { display: block; width: 100%; min-width: 0; }
      .data-table thead { display: none; }
      .data-table tbody { display: grid; gap: 10px; }
      .data-table tr { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; padding: 14px; background: rgba(255,255,255,.62); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 4px 12px rgba(15,30,85,.04); }
      .data-table td { display: flex; min-width: 0; min-height: 0; padding: 0 !important; border: 0 !important; flex-direction: column; align-items: flex-start; gap: 3px; }
      .data-table td:first-child { grid-column: 1 / -1; padding-right: 36px !important; }
      .data-table td:nth-child(2)::before { content: 'PELANGGAN'; }
      .data-table td:nth-child(3)::before { content: 'TEKNISI'; }
      .data-table td:nth-child(4)::before { content: 'TANGGAL'; }
      .data-table td:nth-child(5)::before { content: 'STATUS'; }
      .data-table td:nth-child(6)::before { content: 'LAPORAN'; }
      .data-table td:not(:first-child)::before { color: var(--muted); font-size: 9px; font-weight: 800; letter-spacing: .08em; }
      .data-table td:last-child { position: absolute; top: 10px; right: 10px; }
      .data-table td:last-child::before { display: none; }
      .data-table td:last-child .row-actions { width: 32px; height: 32px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
    }
    @media (prefers-reduced-transparency: reduce) {
      .surface, .btn, .search, .select-like, .account, .nav button.active, .icon-button:hover, .badge, .note, .message-bubble, .linked, .audio, .attachment, .warning-box { backdrop-filter: none; -webkit-backdrop-filter: none; background: #fff; }
    }

    /* Stable navigation hover: keep the icon visible and prevent the item from fading or jumping. */
    .sidebar { position: relative; z-index: 20; overflow: visible; }
    .nav { position: relative; z-index: 21; overflow: visible; }
    .nav button,
    .nav button:hover,
    .nav button.active,
    .nav button.active:hover {
      opacity: 1;
      visibility: visible;
      transform: none;
    }
    .nav button {
      color: #64748b;
      background: transparent;
      border-color: transparent;
      isolation: isolate;
    }
    .nav button:hover {
      color: #0F1E55;
      background: #EEF1F6;
      border-color: rgba(15,30,85,.10);
      box-shadow: 0 6px 16px rgba(15,30,85,.10), inset 0 1px 0 rgba(255,255,255,.9);
    }
    .nav button.active,
    .nav button.active:hover {
      color: #FFFFFF;
      background: #0F1E55;
      border-color: #0F1E55;
      box-shadow: 0 8px 20px rgba(15,30,85,.22), inset 0 1px 0 rgba(255,255,255,.18);
    }
    .nav button .nav-icon,
    .nav button .nav-icon svg {
      color: inherit;
      opacity: 1;
      visibility: visible;
      stroke: currentColor;
      fill: none;
    }
    .nav button[data-tooltip]::after,
    .nav button[data-tooltip]::before { z-index: 100; }
    .nav button[data-tooltip]::before { border-left-color: transparent; border-right-color: #0F1E55; }
    .nav button[data-tooltip]:hover::after { opacity: 1; }
    .nav button[data-tooltip]:hover::before { opacity: 1; }

    /* Compact icon scale: one step smaller with a proportionate active tile. */
    .nav button { width: 64px; height: 64px; border-radius: 18px; }
    .nav button .nav-icon { width: 38px; height: 38px; display: grid; place-items: center; }
    .nav button .nav-icon svg { width: 28px; height: 28px; stroke-width: 1.85; }
    .nav button.active .nav-icon svg { width: 30px; height: 30px; stroke-width: 1.95; }
    .nav button:hover .nav-icon svg { opacity: 1; }
    .header-notification { position: relative; width: 42px; height: 42px; color: var(--brand); background: rgba(255,255,255,.68); border: 1px solid rgba(15,30,85,.12); border-radius: 12px; box-shadow: 0 6px 16px rgba(15,30,85,.08); }
    .header-notification:hover { color: var(--brand); background: #fff; }
    .header-notification .icon { width: 18px; height: 18px; }
    .header-notification .badge-dot { position: absolute; top: 8px; right: 8px; width: 7px; height: 7px; margin: 0; border: 2px solid #fff; border-radius: 50%; background: #d13d50; }
    .page-heading .actions { gap: 10px; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Navigasi utama">
      <div class="brand">
        <button class="brand-logo-btn" data-route-target="overview" aria-label="BisaLapor Dashboard">
          <img class="logo-mark" src="../designs/assets/logo-transparent.png" alt="BisaLapor" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'" />
          <span class="brand-fallback" style="display:none">B</span>
        </button>
      </div>
      <nav class="nav" id="main-nav">
        <button data-route="overview" data-tooltip="Overview" aria-label="Overview"><span class="nav-icon" data-icon="dashboard"></span></button>
        <button data-route="work-orders" data-tooltip="Work Orders" aria-label="Work Orders"><span class="nav-icon" data-icon="clipboard"></span></button>
        <button data-route="reports" data-tooltip="Reports" aria-label="Reports"><span class="nav-icon" data-icon="report"></span></button>
        <button data-route="inbox" data-tooltip="AI Inbox" aria-label="AI Inbox"><span class="nav-icon" data-icon="inbox"></span></button>

      </nav>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-bottom">
        <button class="sidebar-avatar-btn" data-tooltip="Rafi Pratama (Owner)" aria-label="Profil Rafi Pratama" data-action="toast" data-message="Profil Rafi Pratama · Owner Workspace">
          <span class="avatar">RP</span>
          <span class="status-dot"></span>
        </button>

    <main class="main">
      <section class="content" id="screen-root" aria-live="polite"></section>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script>
    const icons = {
      dashboard: '<svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1.8"/><rect x="14" y="3.5" width="6.5" height="6.5" rx="1.8"/><rect x="3.5" y="14" width="6.5" height="6.5" rx="1.8"/><rect x="14" y="14" width="6.5" height="6.5" rx="1.8"/></svg>',
      clipboard: '<svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4.5V3h6v1.5M8 10h8M8 14h6"/></svg>',

      return pageHeading('Technicians','Kelola anggota tim lapangan dan penugasan mereka.',button('Undang teknisi',{primary:true,icon:'userplus',message:'Undangan teknisi dibuat.'})) + `<div class="toolbar">${search('Cari nama atau email...','technician-search')}<button class="select-like" data-action="toast" data-message="Filter teknisi dibuka.">${actionIcon('filter')}Semua status</button><span class="toolbar-meta" style="color:var(--muted);font-size:11px;margin-left:auto">6 teknisi aktif</span></div><article class="surface panel table-wrap"><table class="data-table"><thead><tr><th>TEKNISI</th><th>STATUS</th><th>PEKERJAAN AKTIF</th><th>LAPORAN</th><th></th></tr></thead><tbody>${rows.map((x,i)=>`<tr><td><div style="display:flex;align-items:center;gap:12px"><span class="avatar">${x[0].split(' ').map(y=>y[0]).join('')}</span><div><div class="cell-title">${x[0]}</div><div class="cell-meta">${x[1]}</div></div></div></td><td>${badge(x[2],x[2])}</td><td class="cell-muted">${x[3]}</td><td class="cell-muted">${x[4]}</td><td><button class="row-actions" data-action="toast" data-message="Menu teknisi dibuka.">${actionIcon('more')}</button></td></tr>`).join('')}</tbody></table></article>`;
    }

    function customersScreen() {
      const rows = [['PT Arunika','Gedung Arunika','12 work orders','4 laporan aktif'],['CV Nusa Data','Kantor Pusat','8 work orders','2 laporan aktif'],['PT Sinar Jaya','Pabrik Cikarang','6 work orders','1 laporan aktif'],['PT Meridian','Gedung Meridian','5 work orders','0 laporan aktif']];
      return pageHeading('Customers','Direktori pelanggan dan riwayat pekerjaan.',button('Tambah pelanggan',{primary:true,icon:'plus',message:'Form pelanggan baru siap dibuka.'})) + `<div class="toolbar">${search('Cari nama pelanggan...','customer-search')}<span class="toolbar-meta" style="color:var(--muted);font-size:11px;margin-left:auto">18 pelanggan</span></div><div class="customer-grid">${rows.map((x,i)=>`<article class="surface panel customer-card"><div class="customer-header"><span class="avatar customer-avatar">${x[0].replace(/^(PT|CV) /,'').slice(0,2).toUpperCase()}</span><div><h2>${x[0]}</h2><p class="panel-subtitle">${x[1]}</p></div><button class="row-actions" data-action="toast" data-message="Detail pelanggan dibuka." aria-label="Buka detail pelanggan">${actionIcon('arrow')}</button></div><div class="customer-divider"></div><div class="customer-stats"><div><div class="label">WORK ORDERS</div><div class="field-value">${x[2]}</div></div><div><div class="label">LAPORAN AKTIF</div><div class="field-value">${x[3]}</div></div></div></article>`).join('')}</div>`;
    }

    function settingsScreen() {
      return pageHeading('Team & Access','Kelola anggota, role, dan akses workspace.',button('Undang anggota',{primary:true,icon:'userplus',message:'Undangan anggota dibuat.'})) + `<div class="settings-layout"><aside class="surface panel settings-nav">${[['building','Company Profile'],['users','Team & Access'],['link','Integrations'],['report','Security & Logs']].map((x,i)=>`<button class="settings-link ${i===1?'active':''}" data-action="toast" data-message="${x[1]} dipilih.">${actionIcon(x[0])}${x[1]}</button>`).join('')}<div class="settings-divider"></div><div class="settings-field"><div class="label">WORKSPACE ID</div><div class="value">arunika-prod</div></div><div class="settings-field"><div class="label">PLAN</div><div class="badge-wrap" style="margin-top:6px">${badge('Pilot','Aktif')}</div></div></aside><div class="settings-content"><article class="surface panel member-list">${panelHead('Anggota workspace','Peran menentukan data dan tindakan yang dapat diakses.')}<div class="member-row member-header"><span>NAMA</span><span>ROLE</span><span>STATUS</span><span></span></div>${[['Rafi Pratama','Owner','Aktif'],['Dina Kartika','Technician','Aktif'],['Budi Santoso','Technician','Aktif'],['Sari Ningsih','Supervisor','Nonaktif']].map((x,i)=>`<div class="member-row"><div class="member"><span class="avatar">${x[0].split(' ').map(y=>y[0]).join('')}</span><div><div class="member-name">${x[0]}</div><div class="member-email">${i===0?'rafi@bisalapor.id':x[0].split(' ')[0].toLowerCase()+'@arunika.id'}</div></div></div><span class="cell-muted">${x[1]}</span>${badge(x[2],x[2])}<button class="row-actions" data-action="toast" data-message="Menu anggota dibuka.">${actionIcon('more')}</button></div>`).join('')}</article><article class="surface panel integration">${panelHead('Integrasi aktif','Kanal yang dapat menerima dokumentasi teknisi.')}<div class="integration-row"><span class="avatar" style="border-radius:12px">${actionIcon('send')}</span><div><div class="integration-title">Telegram Bot</div><div class="integration-meta">@arunika_lapor_bot · Webhook verified</div></div><div class="badge-wrap" style="margin-left:auto">${badge('Aktif','Aktif')}</div></div><div class="integration-actions">${button('Kelola integrasi',{icon:'settings',message:'Pengaturan integrasi dibuka.'})}</div><p class="panel-subtitle integration-desc">AI hanya memproses pesan yang masuk melalui kanal terintegrasi.</p></article></div></div>`;
    }

    const screens = { overview: overviewScreen, 'work-orders': workOrdersScreen, 'work-order-detail': workOrderDetailScreen, reports: reportsScreen, 'report-review': reportReviewScreen, inbox: inboxScreen, technicians: techniciansScreen, customers: customersScreen, settings: settingsScreen };
    const labels = { overview:'Overview', 'work-orders':'Work Orders', 'work-order-detail':'Work Orders / Detail', reports:'Reports', 'report-review':'Reports / Review', inbox:'AI Inbox', technicians:'Technicians', customers:'Customers', settings:'Settings / Team & Access' };
    let currentRoute = 'overview';
    let toastTimer;
    function showToast(message) { const el = document.getElementById('toast'); el.textContent = message; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2600); }
    function route(route) {
      currentRoute = route;
      if (location.hash.replace(/^#/, '') !== route) location.hash = route;
      /* Screen HTML comes only from fixed local templates; no user-provided values are interpolated. */
      document.getElementById('screen-root').innerHTML = screens[route]();
      const activeRoute = route === 'work-order-detail' ? 'work-orders' : route === 'report-review' ? 'reports' : route;
      document.querySelectorAll('#main-nav button').forEach(b => {
        const isActive = b.dataset.route === activeRoute;
        b.classList.toggle('active', isActive);
        if (isActive) b.setAttribute('aria-current', 'page');
        else b.removeAttribute('aria-current');
      });
      bindEvents();
    }
    function bindEvents() {
      document.querySelectorAll('[data-route-target]').forEach(el => el.addEventListener('click', () => route(el.dataset.routeTarget)));
      document.querySelectorAll('[data-action="toast"]').forEach(el => el.addEventListener('click', () => showToast(el.dataset.message || 'Aksi berhasil.')));
      document.querySelectorAll('[data-action="approve-report"]').forEach(el => el.addEventListener('click', () => { showToast('Laporan disetujui dan versi final dicatat.'); setTimeout(() => route('reports'), 450); }));
      document.querySelectorAll('[data-report-tab]').forEach(el => el.addEventListener('click', () => { document.querySelectorAll('[data-report-tab]').forEach(x => x.classList.remove('active')); el.classList.add('active'); const val = el.dataset.reportTab; document.querySelectorAll('#report-rows tr').forEach(row => row.style.display = val === 'Semua laporan' || row.dataset.reportStatus.toLowerCase().includes(val.replace('Perlu ','').replace('Butuh ','' ).toLowerCase()) ? '' : 'none'); }));
      document.querySelectorAll('input[type="search"]').forEach(input => input.addEventListener('input', () => { const query = input.value.toLowerCase(); const root = input.id === 'work-search' ? '#work-order-rows tr' : input.id === 'report-search' ? '#report-rows tr' : null; if (root) document.querySelectorAll(root).forEach(row => row.style.display = row.dataset.search.includes(query) ? '' : 'none'); }));
      document.querySelectorAll('[data-inbox-item]').forEach(el => el.addEventListener('click', () => { document.querySelectorAll('[data-inbox-item]').forEach(x => x.classList.remove('selected')); el.classList.add('selected'); showToast('Pesan dipilih. Detail sumber diperbarui.'); }));
    }
    document.querySelectorAll('#main-nav button').forEach(el => el.addEventListener('click', () => route(el.dataset.route)));
    const initialHash = location.hash.replace(/^#/, '');
    route(screens[initialHash] ? initialHash : 'overview');
    window.addEventListener('hashchange', () => {
      const r = location.hash.replace(/^#/, '');
      if (screens[r] && r !== currentRoute) route(r);
    });
  </script>
</body>
</html>
